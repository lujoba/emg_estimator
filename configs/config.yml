# Path for the dataset
dataset_path: data/1dof_dataset/

# Default params
# input_shape[0] number of samples/windows
# input_shape[1] number of electrodes, can be:
# 112 (128 electrodes with differential arrangements),
# 128 (128 electrodes with monopolar arrangements),
# 224 (256 electrodes with differential arrangements),
# 256 (256 electrodes with monopolar arrangements)
# Shift is the step of the moving window implementation
# with a step of 20, the force will be approximately the
# same size as the original force signal, without 
# interpolation.
input_shape:
  - 100
  - 112
shift:
  - 10
output_shape: 5
batch_size: 128
epoch: 200
data_augment: False

# Specific model params
model_params:
  dense:
    - input_shape: [100, 256]
    - output_shape: 128
    - num_layers: 8

  resnet18_2d:
    - complex: False

  resnet18_3d:
    - WINDOW_SIZE: 100
    - HEIGHT: 16
    - WIDTH: 16
    - num_lstm_blocks: 1
    - num_channels: 1
    - output_dim: 5

  transformers:
    - num_channels: 2
    - complex: False

  nmf:
    - input_shape: [100, 256]
    - num_components: 256
    - output_shape: 128
