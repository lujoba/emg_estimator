# GVT within-subject (um modelo por paciente), protocolo 80/20 — PhD_Treino128 / PhD_SelecaoFixa
#   emgpred train individual                              -> 128 eletrodos          (fixo_todos_8020)
#   emgpred train individual --set data.selection=media   -> 32 de maior média      (fixo_media_8020)
#   emgpred train individual --set data.selection=sharpe  -> 32 fronteira eficiente (fixo_sharpe_8020)
#   ... --set model.d_model=32                            -> ablação de tamanho     (fixo_<sel>_8020_d32)
#   --set data.selection=aleatorio data.random_seed=1      -> 32 sorteados (fixo_aleatorio1_8020[_d32])
[paths]
raw_dir            = "$EMGPRED_DATA/processed/RAW"
cache_dir          = "$EMGPRED_DATA/processed/RAW128_INDIV_CACHE"   # .npy descomprimidos (compartilhado)
saliency_dir       = "$EMGPRED_LOGS/importancia_eletrodos"
best_channels_file = "configs/channels/best32.json"
save_dir           = "logs/fixo_{sel}_8020{suffix}{aug}"

[data]
selection = "todos"      # todos | media | sharpe | best | aleatorio   (ou channels_file = "<lista>")
random_seed = 0          # só para aleatorio: pasta fixo_aleatorio<seed>_...
k = 32
split_test_size = 0.2    # treino 80% / validação 20% do _train.npz
seed = 42

[model]                  # arquitetura conferida carregando os pesos salvos em novo/paciente_*
name = "gvt"
d_model = 128
n_heads = 4
n_layers_time = 4
n_layers_space = 4
mlp_ratio = 4.0
dropout = 0.4
pooling_method = "cls"
pos_embedding_method = "learned"
use_causal_mask_time = true
use_causal_mask_space = false

[augmentation]           # só no treino; ordem fixa: amplitude, passabanda, fase, deslocamento, mascara,
names = []               # ruido, mascara_freq, warp, queda_canal, eletrodo  (ex.: ["amplitude"])

[training]
batch_size = 128
epochs = 400
learning_rate = 1e-3
clipnorm = 1.0
early_stop_patience = 15
lr_patience = 10
lr_factor = 0.75

[kalman]                 # RTS em janela centrada de ±3 janelas (atraso ≈ 29 ms)
method = "window"
half_window = 3
q = 0.012
r = 1.0

[moving_average]         # alternativa mais barata para o dispositivo (métricas *_ma)
half_window = 3          # 2h+1 predições
causal = false           # true: só predições passadas (sem esperar o futuro)
