[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emgpred"
version = "1.0.0"
description = "Estimação contínua de ângulos dos dedos a partir de HD-sEMG com transformers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "tensorflow>=2.21,<2.22",
    "keras>=3.15",
    "tensorboard",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "h5py",
    "pykalman",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
cuda = ["tensorflow[and-cuda]>=2.21,<2.22"]
notebooks = ["ipykernel", "ipywidgets", "seaborn"]
dev = ["pytest"]

[project.scripts]
emgpred = "emgpred.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
